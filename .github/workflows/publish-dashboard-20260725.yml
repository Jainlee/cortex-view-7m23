name: Publish Cortex dashboard 2026-07-25

on:
  push:
    paths:
      - '.github/workflows/publish-dashboard-20260725.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update generated dashboard sections
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          lines = text.splitlines()

          replacements = [
              ('    <header class="system-bar">', Path('.publish-20260725/header.html')),
              ('      <section class="metrics"', Path('.publish-20260725/metrics.html')),
              ('    <section class="section" id="pipeline"', Path('.publish-20260725/pipeline.html')),
              ('    <footer>', Path('.publish-20260725/footer.html')),
          ]

          for prefix, fragment_path in replacements:
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'{prefix!r}: expected 1 line, found {len(matches)}')
              fragment = fragment_path.read_text(encoding='utf-8').rstrip('\n')
              if '\n' in fragment:
                  raise SystemExit(f'{fragment_path}: fragment must be one line')
              lines[matches[0]] = fragment

          text = '\n'.join(lines) + '\n'

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement expected once, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '主题热度：Codex 125 · Agent 84 · Context Engineering 80',
              '主题热度：Codex 125 · Agent 83 · Context Engineering 80',
          )
          replace_once(
              '<text class="count" x="325" y="75">84</text>',
              '<text class="count" x="325" y="75">83</text>',
          )
          replace_once(
              '<div class="topic" data-topic-key="agent"><strong>Agent</strong><div class="note">高热度主题<div class="bar"><span style="width:67%"></span></div></div><b>84</b></div>',
              '<div class="topic" data-topic-key="agent"><strong>Agent</strong><div class="note">高热度主题<div class="bar"><span style="width:66%"></span></div></div><b>83</b></div>',
          )
          replace_once(
              '<div class="signal"><b>数据刷新</b><p>2026-07-24T11:06:51+08:00</p></div>',
              '<div class="signal"><b>数据刷新</b><p>2026-07-25T10:56:33+08:00</p></div>',
          )
          replace_once(
              '<div class="signal"><b>全库扫描</b><p>568</p></div>',
              '<div class="signal"><b>全库扫描</b><p>567</p></div>',
          )
          replace_once(
              '<div class="signal"><b>待分流新增</b><p>17 条原始笔记待预精读 / 待分流，不计入正式精读</p></div>',
              '<div class="signal"><b>待分流新增</b><p>14 条原始笔记待预精读 / 待分流，不计入正式精读</p></div>',
          )
          replace_once(
              '<summary>查看 17 条待预精读 / 待分流新增</summary>',
              '<summary>查看 14 条待预精读 / 待分流新增</summary>',
          )

          old_readings = (
              '<tbody><tr><td>Matt Pocock 的技能库与端到端 AI 编码工作流</td><td>01-精读笔记/2026-07-24 - Matt Pocock Skills 工作流案例精读.md</td><td>2026-07-24</td></tr>'
              '<tr><td>Claude Code Skills 完全指南</td><td>01-精读笔记/2026-07-24 - Claude Code Skills 生命周期与触发机制精读.md</td><td>2026-07-24</td></tr>'
              '<tr><td>Skills 从 0 到 1，如何设计一个商用级 Skill</td><td>01-精读笔记/2026-07-23 - 商用级 Skill 设计与迭代精读.md</td><td>2026-07-23</td></tr>'
              '<tr><td>企业 RAG 不是上传几个 PDF</td><td>01-精读笔记/2026-07-23 - 企业 RAG 版本权限与可追溯性精读.md</td><td>2026-07-23</td></tr></tbody>'
          )
          new_readings = (
              '<tbody><tr><td>别问 Agent 强不强，先问任务稳不稳</td><td>01-精读笔记/2026-07-24 - 任务稳定性与Agent探索边界案例精读.md</td><td>2026-07-24</td></tr>'
              '<tr><td>梁文锋投资人会议文字稿修正稿</td><td>01-精读笔记/2026-07-24 - 个人使用AI的上下文持续学习与长期主线精读.md</td><td>2026-07-24</td></tr>'
              '<tr><td>Matt Pocock 的技能库与端到端 AI 编码工作流</td><td>01-精读笔记/2026-07-24 - Matt Pocock Skills 工作流案例精读.md</td><td>2026-07-24</td></tr>'
              '<tr><td>Claude Code Skills 完全指南</td><td>01-精读笔记/2026-07-24 - Claude Code Skills 生命周期与触发机制精读.md</td><td>2026-07-24</td></tr></tbody>'
          )
          replace_once(old_readings, new_readings)

          pending_rows = [
              '<tr><td>别问 Agent 强不强，先问任务稳不稳 2</td><td>笔记同步助手/2026-WEEK30/别问 Agent 强不强，先问任务稳不稳 2.md</td><td>待预精读 / 待分流</td></tr>',
              '<tr><td>别问 Agent 强不强，先问任务稳不稳</td><td>笔记同步助手/2026-WEEK30/别问 Agent 强不强，先问任务稳不稳.md</td><td>待预精读 / 待分流</td></tr>',
              '<tr><td>梁文锋投资人会议文字稿修正稿</td><td>笔记同步助手/2026-WEEK30/梁文锋投资人会议文字稿修正稿.md</td><td>待预精读 / 待分流</td></tr>',
          ]
          for row in pending_rows:
              replace_once(row, '')

          required = [
              '<meta name="robots" content="noindex, nofollow, noarchive" />',
              'data-refreshed-at="2026-07-25T10:56:33+08:00"',
              '<div class="num">567</div>',
              '<div class="num">104</div>',
              '<strong>11 篇正式精读</strong>',
              '任务稳定性与Agent探索边界案例精读.md',
              '个人使用AI的上下文持续学习与长期主线精读.md',
              '查看 14 条待预精读 / 待分流新增',
              'Agent 83 · Context Engineering',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing required markers: {missing}')

          forbidden = [
              '<div class="num">568</div>',
              '<div class="num">99</div>',
              '<strong>9 篇正式精读</strong>',
              '查看 17 条待预精读 / 待分流新增',
              '别问 Agent 强不强，先问任务稳不稳 2.md</td><td>待预精读',
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'stale markers remain: {remaining}')

          index.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate and remove one-shot files
        run: |
          grep -q 'data-refreshed-at="2026-07-25T10:56:33+08:00"' index.html
          grep -q '<div class="num">567</div>' index.html
          grep -q '<div class="num">104</div>' index.html
          grep -q '任务稳定性与Agent探索边界案例精读.md' index.html
          grep -q '<meta name="robots" content="noindex, nofollow, noarchive" />' index.html
          rm -rf .publish-20260725
          rm -f .github/workflows/publish-dashboard-20260725.yml
          git diff --check
      - name: Commit public dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Cortex dashboard refresh 2026-07-25'
          git push
